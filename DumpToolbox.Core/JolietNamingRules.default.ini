; DumpToolbox mastering-specific Joliet -> primary ISO9660 naming profiles
; Generated as JolietNamingRules.ini beside DumpToolbox.exe on first run.
; Edit the external file to add/change mastering rules without rebuilding DumpToolbox.
;
; Methods understood by the core projection matcher:
;   Level1, Level2, PunctuationElision, SeparatorInsensitive, NumericAlias,
;   OpaqueTildeAlias, HexOrdinalAlias
; Optional formatter policy fields:
;   FileVersioning=Version1|None
;   RecordOrdering=PreservePrimaryRecordOrder|CaseSensitiveUcs2Identifier|
;                  CaseInsensitiveUcs2Identifier|AccentFoldedCaseSensitiveIdentifier
;   PathTableOrdering=PreservePrimaryDirectoryOrder|CaseSensitiveUcs2Identifier|
;                     CaseInsensitiveUcs2Identifier
;   IdentityContains=comma-separated alternatives searched across System/Application/Preparer IDs
;   IdentityExcludes=comma-separated substrings that disqualify a profile
; The more specialised folder/donor ordinal fallbacks remain safety-gated by exact size,
; timestamp/order and reverse uniqueness. If NO profile matches a disc, the historic
; generic DumpToolbox naming rules are used unchanged.

[Joliet-Naming]
Enabled=true
FormatVersion=2

[Profile001]
Enabled=true
Name=Adaptec/Roxio Easy CD Creator
ApplicationContains=EASY CD CREATOR
DataPreparerContains=
SystemIdMatch=*
Methods=Level1,Level2,PunctuationElision,SeparatorInsensitive,NumericAlias
FileVersioning=Version1
RecordOrdering=PreservePrimaryRecordOrder
PathTableOrdering=PreservePrimaryDirectoryOrder

[Profile002]
Enabled=true
Name=Roxio Burn Engine
ApplicationContains=ROXIO BURN ENGINE
DataPreparerContains=
SystemIdMatch=*
Methods=Level1,Level2,PunctuationElision,SeparatorInsensitive,NumericAlias,OpaqueTildeAlias
FileVersioning=Version1
RecordOrdering=CaseInsensitiveUcs2Identifier
PathTableOrdering=CaseInsensitiveUcs2Identifier

