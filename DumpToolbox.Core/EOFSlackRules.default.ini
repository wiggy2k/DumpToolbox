; DumpToolbox EOF slack mastering rules
; Generated as EOFSlackRules.ini beside DumpToolbox.exe on first run.
; Edit the external EOFSlackRules.ini to add/change rules without rebuilding DumpToolbox.
;
; Default behaviour is normal zero-filled EOF slack.
; A rule is therefore only an override: copy bytes after logical EOF from the
; same byte offsets at LBA-DeltaSectors.
;
; SystemIdMatch values:
;   *         = any PVD System ID
;   <blank>   = PVD System ID must be empty/blank
;   other     = exact trimmed, case-insensitive match
; Rules may match ApplicationContains, DataPreparerContains, or both.

[EOF-SlackData-Fix]
Enabled=true
FormatVersion=4

[Rule1]
Enabled=true
Name=Easy CD Creator 4.2 (292), CD-RTOS CD-BRIDGE
ApplicationContains=EASY CD CREATOR 4.2 (292)
SystemIdMatch=CD-RTOS CD-BRIDGE
DeltaSectors=24
Confidence=LOW

